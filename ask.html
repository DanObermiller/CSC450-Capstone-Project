<body>
	<div id="content">
		<div class="profcontainer">
			<h1>Ask Us Anything</h1><br><br>
			<div id="chat-container">
			<div id="chat-header">Live Chat Room</div>
			<div id="message-box">
				<!-- Messages will appear here -->
				<div class="message received">Welcome to the UltraMart support center! Ask a question and a professional will be with you shortly.</div>
			</div>
			<form id="chat-form">
				<input type="text" id="message-input" placeholder="Type a message..." />
				<button type="submit" id="send-btn">Send</button>
			</form>
		</div>

		<script>
			const chatForm = document.getElementById('chat-form');
			const messageInput = document.getElementById('message-input');
			const messageBox = document.getElementById('message-box');

			chatForm.addEventListener('submit', function(e) {
				e.preventDefault();
				
				const messageText = messageInput.value.trim();
				if (messageText === '') return;

				appendMessage(messageText, 'sent');
				messageInput.value = '';

				// Simulate an automated response after 1 second
				//setTimeout(() => {
				//	appendMessage("Message Sent.", 'received');
				//}, 1000);
			});

			function appendMessage(text, type) {
				const messageDiv = document.createElement('div');
				messageDiv.classList.add('message', type);
				messageDiv.textContent = text;
				
				messageBox.appendChild(messageDiv);
				
				// Auto scroll to the bottom of the chat box
				messageBox.scrollTop = messageBox.scrollHeight;
			}
		</script>
		</div>
	
	</div>
</body>
